<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>document.write("hello")</script>
</head>
<body>
    <script>
        function person(nm, mks) {
            // alert(this);

            this.name = nm;
            this.mks = mks;
        }

        // Creating object
        var ob = new person("mona", 80);
        document.write(ob);
        document.write(this.constructor);
        document.write("<hr />");
        document.write(ob.name + " " + ob["name"]);
        document.write("<hr />");
        for (let pp in ob) {
            document.write(pp + " " + ob[pp] + "<br>");
        }
        document.write(ob instanceof person);
        document.write("<br>");
        document.write(ob instanceof Object);
        var ob1 = new person("gyu", 1000);
        console.log(person.length);
        console.log(ob.length);
    </script>

</body>
</html>
